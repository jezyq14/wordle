name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: Wordle-Linux-x64
            archive_name: Wordle-Linux-x64.tar.gz
          - os: windows-latest
            artifact_name: Wordle-Windows-x64
            archive_name: Wordle-Windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable (Linux only)
        if: runner.os == 'Linux'
        run: chmod +x gradlew

      - name: Build Portable App Image with JPackage
        run: ./gradlew jpackageImage

      # Pakowanie wersji linuksowej (.tar.gz)
      - name: Compress Linux package
        if: runner.os == 'Linux'
        run: tar -czvf ${{ matrix.archive_name }} -C build/jpackage Wordle

      # Pakowanie wersji windowsowej do .zip za pomocą systemowego tar (nie gubi DLL-ek)
      - name: Compress Windows package
        if: runner.os == 'Windows'
        run: tar -a -c -f ${{ matrix.archive_name }} -C build/jpackage Wordle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: |
            Wordle-Linux-x64/Wordle-Linux-x64.tar.gz
            Wordle-Windows-x64/Wordle-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true